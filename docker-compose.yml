name: deepseek-harness

services:
  dsh:
    image: ghcr.io/armerr/deepseek-harness:latest
    # Uncomment to build from this checkout instead of pulling the published image.
    # build: .
    container_name: dsh
    init: true
    restart: unless-stopped
    ports:
      - "3080:3080"
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DSH_PUBLIC_URL: ${DSH_PUBLIC_URL:-http://localhost:3080/}
      DSH_TRUSTED_HOST: ${DSH_TRUSTED_HOST:-}
    volumes:
      - dsh-data:/data

volumes:
  dsh-data:
